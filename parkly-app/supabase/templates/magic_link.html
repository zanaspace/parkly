<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Parkly sign-in code</title>
</head>
<body style="margin: 0; padding: 0; background-color: #FAFAF9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #171B1A;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color: #FAFAF9; padding: 40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width: 500px; background-color: #FFFFFF; border-radius: 12px; border: 1px solid #E9EBEA; overflow: hidden; box-shadow: 0 4px 12px rgba(19, 112, 102, 0.05);">
          <!-- Brand Header -->
          <tr>
            <td style="background-color: #137066; padding: 24px 32px; text-align: left;">
              <span style="font-size: 22px; font-weight: 700; color: #FFFFFF; letter-spacing: -0.5px;">Parkly</span>
            </td>
          </tr>
          <!-- Body Content -->
          <tr>
            <td style="padding: 36px 32px 28px 32px;">
              <h1 style="margin: 0 0 12px 0; font-size: 20px; font-weight: 600; color: #171B1A;">Your sign-in code</h1>
              <p style="margin: 0 0 24px 0; font-size: 15px; line-height: 24px; color: #4E5654;">
                Use the verification code below to complete your sign-in to Parkly.
              </p>
              
              <!-- Code Card / Styled Display -->
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin: 0 0 24px 0;">
                <tr>
                  <td align="center" style="background-color: #EEF8F6; border: 1.5px solid #137066; border-radius: 8px; padding: 18px 24px;">
                    <span style="display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #0F5A53; margin-bottom: 6px;">Sign-in code</span>
                    <span style="font-size: 32px; font-weight: 700; letter-spacing: 6px; color: #137066; font-family: 'SF Mono', Consolas, Monaco, monospace;">{{ .Token }}</span>
                  </td>
                </tr>
              </table>

              <p style="margin: 0 0 8px 0; font-size: 14px; line-height: 20px; color: #67706E;">
                ⏱ This code expires in <strong>1 hour</strong>.
              </p>
              <p style="margin: 0; font-size: 13px; line-height: 20px; color: #8A9290;">
                If you did not request this code, you can safely ignore this email.
              </p>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="background-color: #FAFAF9; padding: 20px 32px; border-top: 1px solid #E9EBEA; text-align: center;">
              <p style="margin: 0; font-size: 12px; color: #8A9290;">
                Parkly • Verified off-street parking for Lagos
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
